[gw2162]
type=aor
contact=sip:192.168.0.216:5060
qualify_frequency=60

[gw2162]                      ; endpoint
type=endpoint
transport=transport-udp
context=from-internal
disallow=all
allow=alaw
allow=ulaw
allow=opus
aors=gw2162                   ; <— match the AOR name above
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
inband_progress = yes
direct_media = no
[gw2162-identify]
type=identify
endpoint=gw2162               ; <— match the endpoint name
match=192.168.0.216
