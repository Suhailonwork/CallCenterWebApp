[gw2164]
type=aor
contact=sip:192.168.0.216:5060
qualify_frequency=60

[gw2164]                      ; endpoint
type=endpoint
transport=transport-udp
context=from-trunk
disallow=all
allow=alaw
allow=ulaw
aors=gw2164                   ; <— match the AOR name above
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[gw2164-identify]
type=identify
endpoint=gw2164               ; <— match the endpoint name
match=192.168.0.216
