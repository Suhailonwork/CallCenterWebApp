[from-internal]
; Round-robin (2 gateways) — defensive, no failover
exten => _24[6-9]XXXXXXXXX,1,NoOp(Outbound round-robin gw2163/gw2162 — defensive)
 same  => n,Set(DNUM=${EXTEN:2})                       ; strip leading 2 digits
 same  => n,Set(GWCOUNT=${GLOBAL(GWCOUNT)})            ; read global (may be empty)
 same  => n,GotoIf($["${GWCOUNT}" = ""]?init)           ; if empty go init
 same  => n,Set(GWCOUNT=$[${GWCOUNT} + 1])             ; safe: GWCOUNT is numeric here
 same  => n,Goto(select)
 same  => n(init),Set(GWCOUNT=1)                       ; first use -> 1
 same  => n(select),Set(GLOBAL(GWCOUNT)=${GWCOUNT})    ; persist new counter
 same  => n,Set(GW=${IF($[${GWCOUNT}%2 = 0]?gw2163:gw2162)}) ; choose gw (swap order to change first pick)
 same  => n,NoOp(Using gateway: ${GW} (counter ${GWCOUNT}))
 same  => n,Dial(PJSIP/${DNUM}@${GW},40)
 same  => n,Hangup()
