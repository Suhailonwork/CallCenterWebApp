[from-internal]
; Example: dial any mobile starting with 23[6-9]XXXXXXXXX
exten => _23[6-9]XXXXXXXXX,1,NoOp(Outbound mobile via gw2163/gw2162 (random+failover))
 same  => n,Set(DNUM=${EXTEN:2})                       ; strip leading 2 digits if desired
 same  => n,Set(GW=${IF($[${RAND(0,1)}=0]?gw2163:gw2162)})
 same  => n,Set(BACKUP=${IF($["${GW}"="gw2163"]?gw2162:gw2163)})
 same  => n,Dial(PJSIP/${DNUM}@${GW},45,Rr)
 same  => n,ExecIf($["${DIALSTATUS}"!="ANSWER"]?Dial(PJSIP/${DNUM}@${BACKUP},45))
 same  => n,Hangup()
