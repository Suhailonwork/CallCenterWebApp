
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0

; =========================
; Browser Extension 6001
; =========================

[6001-auth]
type=auth
auth_type=userpass
username=6001
password=webrtcpass

[6001-aor]
type=aor
max_contacts=5

[6001]
type=endpoint
transport=transport-wss
context=from-browser
disallow=all
allow=opus,ulaw,alaw
auth=6001-auth
aors=6001-aor

webrtc=yes
rewrite_contact=yes
rtcp_mux=yes
ice_support=yes
media_encryption=dtls
dtls_auto_generate_cert=yes
force_rport=yes

; =========================
; Dinstar Gateway
; =========================

[dinstar]
type=endpoint
context=from-dinstar
disallow=all
allow=ulaw
aors=dinstar-aor

[dinstar-aor]
type=aor
contact=sip:192.168.1.100
