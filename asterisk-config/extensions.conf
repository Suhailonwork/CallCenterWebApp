[general]
static=yes
writeprotect=no

[from-webrtc]
exten => _X.,1,NoOp(Outgoing call from browser: ${EXTEN})
 same => n,Stasis(callapp,outbound)
 same => n,Hangup()

[from-dinstar]
exten => _.,1,NoOp(Incoming from Dinstar: ${CALLERID(num)})
 same => n,Stasis(callapp,inbound)
 same => n,Hangup()

exten => s,1,NoOp(Incoming from Dinstar no-number)
 same => n,Stasis(callapp,inbound)
 same => n,Hangup()

; ---------------------------------------------------------------------
;  Predictive dialer + answering-machine detection (OPTIONAL)
;
;  The predictive engine normally originates the customer leg straight into
;  Stasis. Set `dialer_amd_enabled = 1` in the app's `settings` table and it
;  originates into this context instead: Asterisk runs AMD() first, then hands
;  the channel to Stasis with AMDSTATUS set. ari-app.js reads that variable and
;  hangs up MACHINE answers as VOICEMAIL rather than burning an agent on them.
;
;  With the setting off (the default) this context is simply never used.
;  Tune the detection thresholds in amd.conf.
; ---------------------------------------------------------------------
[predictive-amd]
exten => s,1,NoOp(Predictive answer - running answering machine detection)
 same => n,AMD()
 same => n,NoOp(AMDSTATUS=${AMDSTATUS} AMDCAUSE=${AMDCAUSE})
 same => n,Stasis(callapp,predictive)
 same => n,Hangup()

exten => _X.,1,Goto(s,1)
