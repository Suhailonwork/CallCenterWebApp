;
; Asterisk Built-in mini-HTTP server  (ARI + WebRTC/WSS transport)
; Cleaned: single [general] section, one TLS cert. Deploy to /etc/asterisk/.
;
[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088

; --- TLS (used by the browser softphone over wss://<ip>:8089/ws) ---
tlsenable=yes
tlsbindaddr=0.0.0.0:8089
; The cert MUST contain the IP/host the browser connects to (see SIP_WSS_URL).
; Regenerate with gen-webrtc-cert.sh if you change that IP.
tlscertfile=/etc/asterisk/keys/asterisk.pem
tlsprivatekey=/etc/asterisk/keys/asterisk.pem

enablestatic=yes
servername=Asterisk

